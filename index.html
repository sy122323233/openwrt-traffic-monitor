<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>流量监控 - 多IP折线图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body { font-family: Arial; margin: 20px; }
        table, th, td { border: 1px solid #aaa; border-collapse: collapse; padding: 6px; font-size: 13px; }
        th { background: #f0f0f0; }
        .chart-box { height: 350px; margin-bottom: 20px; }
    </style>
</head>
<body>

<h2>📡 OpenWrt 流量监控（多 IP 折线图）</h2>

<div class="chart-box" id="trendChart"></div>

<table id="statsTable" width="100%">
    <thead>
        <tr><th>IP</th><th>接收(KB)</th><th>发送(KB)</th><th>峰值(KB/s)</th><th>2s均速</th><th>10s均速</th><th>40s均速</th></tr>
    </thead>
    <tbody id="tableBody">
        <tr><td colspan="7">加载中...</td></tr>
    </tbody>
</table>

<script>
    // ================= 可修改配置 =================
    // 你要重点监控的 IP（折线图展示这些）
    const WATCH_IPS = [
        "192.168.43.128",
        "192.168.43.130",
        "8.8.8.8",
        "114.114.114.114"
    ];
    const MAX_POINTS = 40;   // 最多保存多少个时间点
    // ============================================

    const API_URL = 'http://192.168.43.128:8080/stats';  // 改成你的实际后端地址

    let chart = null;
    // 存储每个 IP 的历史速率数据
    let historyMap = {};

    // 初始化历史存储
    WATCH_IPS.forEach(ip => {
        historyMap[ip] = [];
    });

    // 格式化字节为 KB
    function toKB(bytes) {
        return (bytes / 1024).toFixed(2);
    }

    // 更新图表（多条折线）
    function updateChart(clients) {
        if (!chart) {
            chart = echarts.init(document.getElementById('trendChart'));
        }

        const nowTime = new Date().toLocaleTimeString().slice(0,5);

        // 为每个关注的 IP 记录当前 avg2 速率（KB/s）
        WATCH_IPS.forEach(ip => {
            const client = clients.find(c => c.ip === ip);
            let rate = 0;
            if (client) {
                rate = client.avg2 / 1024;  // avg2 是 B/s，转 KB/s
            }
            let arr = historyMap[ip];
            arr.push({ time: nowTime, value: rate });
            if (arr.length > MAX_POINTS) arr.shift();
        });

        // 构造 ECharts 需要的 series
        const series = WATCH_IPS.map(ip => ({
            name: ip,
            type: 'line',
            smooth: true,
            data: historyMap[ip].map(item => item.value)
        }));

        const option = {
            title: { text: '实时流量速率趋势 (KB/s)' },
            tooltip: { trigger: 'axis' },
            legend: { data: WATCH_IPS, top: 30 },
            xAxis: {
                type: 'category',
                data: historyMap[WATCH_IPS[0]]?.map(item => item.time) || []
            },
            yAxis: { type: 'value', name: '速率 (KB/s)' },
            series: series
        };
        chart.setOption(option);
    }

    // 刷新表格 + 图表
    async function refresh() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            const clients = data.clients || [];

            // 更新表格
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            clients.forEach(c => {
                tbody.innerHTML += `<tr>
                    <td><strong>${c.ip}</strong></td>
                    <td>${toKB(c.rx)} KB</td>
                    <td>${toKB(c.tx)} KB</td>
                    <td>${toKB(c.peak)} KB/s</td>
                    <td>${toKB(c.avg2)} KB/s</td>
                    <td>${toKB(c.avg10)} KB/s</td>
                    <td>${toKB(c.avg40)} KB/s</td>
                </tr>`;
            });

            // 更新多折线图
            updateChart(clients);
        } catch (err) {
            console.error(err);
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="7">连接失败</td></tr>';
        }
    }

    refresh();
    setInterval(refresh, 2000);
</script>
</body>
</html>
